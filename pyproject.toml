[project]
name = "foundry"
version = "0.2.1"
description = "Foundry v2 — deterministic lifecycle driver, harness adapters, run ledger, materializer."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
foundry = "foundry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
